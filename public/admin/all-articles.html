<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Articles | Student Sahayak CMS</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      :root {
        --primary: #045c4b;
        --bg: #f4f7f5;
        --text: #333;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        display: flex;
        height: 100vh;
        background-color: var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      /* Unified Sidebar */
      .sidebar {
        width: 260px;
        background: white;
        border-right: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      .brand {
        padding: 1.5rem;
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--primary);
        border-bottom: 1px solid #e0e0e0;
      }
      .nav-menu {
        padding: 1rem 0;
        flex: 1;
        overflow-y: auto;
      }
      .nav-item {
        display: flex;
        align-items: center;
        padding: 0.75rem 1.5rem;
        color: #555;
        text-decoration: none;
        font-weight: 600;
        transition: 0.2s;
      }
      .nav-item i {
        width: 24px;
        font-size: 1.1rem;
        margin-right: 8px;
      }
      .nav-item:hover,
      .nav-item.active {
        background: #e6f7f3;
        color: var(--primary);
        border-right: 4px solid var(--primary);
      }
      .logout-btn {
        padding: 1rem 1.5rem;
        border-top: 1px solid #e0e0e0;
        cursor: pointer;
        color: #d32f2f;
        font-weight: 600;
        margin-top: auto;
        display: flex;
        align-items: center;
      }
      .logout-btn i {
        width: 24px;
        font-size: 1.1rem;
        margin-right: 8px;
      }
      .logout-btn:hover {
        background: #fdf0f0;
      }

      /* Unified Main Content */
      .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .topbar {
        background: white;
        padding: 1.25rem 2rem;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }
      .main-content {
        flex: 1;
        overflow-y: auto;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      /* Page Specific */
      .data-card {
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        overflow: hidden;
      }
      .table-header {
        padding: 1.5rem;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th {
        background: #f8f9fa;
        padding: 1rem 1.5rem;
        color: #555;
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        border-bottom: 1px solid #e0e0e0;
      }
      td {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #eee;
        color: #333;
        font-size: 0.95rem;
      }
      tr:hover {
        background: #fcfcfc;
      }
      .status-badge {
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: bold;
      }
      .status-published {
        background: #e8f5e9;
        color: #2e7d32;
      }
      .status-draft {
        background: #fff3e0;
        color: #e65100;
      }
      .action-link {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        margin-right: 1rem;
      }
      .action-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <!-- Standardized Sidebar -->
    <aside class="sidebar">
      <div class="brand"><i class="fa-solid fa-pen-nib"></i> CMS Admin</div>
      <div class="nav-menu">
        <div id="managerNav">
          <a href="manage-users.html" class="nav-item"
            ><i class="fa-solid fa-users-gear"></i> Manage Users</a
          >
        </div>
        <a href="dashboard.html" class="nav-item"
          ><i class="fa-solid fa-chart-line"></i> Dashboard</a
        >
        <div id="articlesNav">
          <a href="create-article.html" class="nav-item"
            ><i class="fa-solid fa-file-circle-plus"></i> Create Article</a
          >
          <a href="all-articles.html" class="nav-item active"
            ><i class="fa-solid fa-list"></i> All Articles</a
          >
        </div>
        <div id="chaptersNav">
          <a href="create-chapter.html" class="nav-item"
            ><i class="fa-solid fa-book-open"></i> Create Chapter</a
          >
          <a href="all-chapters.html" class="nav-item"
            ><i class="fa-solid fa-layer-group"></i> All Chapters</a
          >
        </div>
        <a href="media-library.html" class="nav-item"
          ><i class="fa-solid fa-images"></i> Media Library</a
        >
        <div
          style="
            margin-top: 1rem;
            border-top: 1px solid #eee;
            padding-top: 1rem;
          "
        >
          <a href="profile.html" class="nav-item"
            ><i class="fa-solid fa-user"></i> My Profile</a
          >
        </div>
      </div>
      <div class="logout-btn" id="logoutBtn">
        <i class="fa-solid fa-right-from-bracket"></i> Sign out
      </div>
    </aside>

    <div class="main-wrapper">
      <!-- Standardized Topbar -->
      <header class="topbar">
        <h2>Article Database</h2>
        <div style="font-weight: 600">
          Welcome back, <span id="userName">Admin</span>
        </div>
      </header>

      <main class="main-content">
        <div class="data-card">
          <div class="table-header">
            <h2 style="color: var(--primary)">Articles</h2>
            <a
              href="create-article.html"
              style="
                background: var(--primary);
                color: white;
                padding: 0.6rem 1.2rem;
                border-radius: 4px;
                text-decoration: none;
                font-weight: 600;
              "
              >+ New Article</a
            >
          </div>
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Author</th>
                <th>Status</th>
                <th>Last Updated</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="articleTableBody">
              <tr>
                <td colspan="6" style="text-align: center">
                  Loading articles...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <!-- Standardized JS Block -->
    <script>
      const user = JSON.parse(localStorage.getItem("cms_user"));
      if (!user) window.location.href = "/admin/index.html";
      document.getElementById("userName").textContent = user.first_name;

      const articleRoles = [
        "CEO",
        "Manager",
        "Content Manager & Editor",
        "Proofreader",
        "Article Writer",
      ];
      const chapterRoles = [
        "CEO",
        "Manager",
        "Content Manager & Editor",
        "Educational Content Writer",
      ];
      if (
        document.getElementById("articlesNav") &&
        !articleRoles.includes(user.role_name)
      )
        document.getElementById("articlesNav").style.display = "none";
      if (
        document.getElementById("chaptersNav") &&
        !chapterRoles.includes(user.role_name)
      )
        document.getElementById("chaptersNav").style.display = "none";
      if (
        document.getElementById("managerNav") &&
        !["CEO", "Manager"].includes(user.role_name)
      )
        document.getElementById("managerNav").style.display = "none";

      document
        .getElementById("logoutBtn")
        .addEventListener("click", async () => {
          await fetch("/api/auth/logout", {
            method: "POST",
            credentials: "include",
          });
          localStorage.removeItem("cms_user");
          window.location.href = "/admin/index.html";
        });

      /* Page Specific JS */
      async function fetchArticles() {
        try {
          const response = await fetch("/api/articles", {
            credentials: "include",
          });
          if (response.status === 401) {
            localStorage.removeItem("cms_user");
            window.location.href = "/admin/index.html";
            return;
          }
          const articles = await response.json();
          const tbody = document.getElementById("articleTableBody");
          tbody.innerHTML = "";

          if (articles.length === 0) {
            tbody.innerHTML =
              '<tr><td colspan="6" style="text-align: center;">No articles found.</td></tr>';
            return;
          }

          articles.forEach((article) => {
            const date = new Date(article.updated_at).toLocaleDateString();
            const statusClass =
              article.status === "Published"
                ? "status-published"
                : "status-draft";
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td style="font-weight: 600;">${article.title}</td>
                <td>${article.category}</td>
                <td>${article.first_name} ${article.last_name}</td>
                <td><span class="status-badge ${statusClass}">${article.status}</span></td>
                <td>${date}</td>
                <td>
                    <a href="/preview/article/${article.id}" target="_blank" class="action-link"><i class="fa-solid fa-eye"></i> View</a>
                    <a href="edit-article.html?id=${article.id}" class="action-link"><i class="fa-solid fa-pen-to-square"></i> Edit</a>
                    <a href="#" onclick="deleteArticle(${article.id})" class="action-link" style="color: #d32f2f;"><i class="fa-solid fa-trash"></i> Delete</a>
                </td>`;
            tbody.appendChild(tr);
          });
        } catch (error) {
          document.getElementById("articleTableBody").innerHTML =
            '<tr><td colspan="6" style="color: red; text-align: center;">Error loading data.</td></tr>';
        }
      }

      async function deleteArticle(id) {
        if (
          !confirm("Are you sure you want to permanently delete this article?")
        )
          return;
        try {
          const response = await fetch(`/api/articles/${id}`, {
            method: "DELETE",
            credentials: "include",
          });
          if (response.ok) fetchArticles();
          else alert("Failed to delete article.");
        } catch (err) {
          alert("Network error.");
        }
      }

      fetchArticles();
    </script>
  </body>
</html>
