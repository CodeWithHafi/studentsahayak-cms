<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMS Login | Student Sahayak</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .login-container {
        background: white;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        text-align: center;
        border-top: 5px solid #045c4b;
      }
      .brand {
        color: #045c4b;
        font-size: 1.8rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
      }
      .subtitle {
        color: #666;
        font-size: 0.9rem;
        margin-bottom: 2rem;
      }
      .form-group {
        margin-bottom: 1.5rem;
        text-align: left;
      }
      .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: #333;
        margin-bottom: 0.5rem;
      }
      .form-group input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1rem;
        transition: border-color 0.3s;
      }
      .form-group input:focus {
        outline: none;
        border-color: #045c4b;
      }
      .btn {
        width: 100%;
        padding: 0.8rem;
        background: #045c4b;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s;
      }
      .btn:hover {
        background: #034639;
      }
      .error-message {
        color: #d32f2f;
        font-size: 0.85rem;
        margin-bottom: 1rem;
        display: none;
      }
      .footer {
        margin-top: 2rem;
        font-size: 0.75rem;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="brand">Student Sahayak CMS</div>
      <div class="subtitle">Content Management & Editorial Workflow</div>

      <div class="error-message" id="errorMessage">
        Invalid email or password.
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            required
            placeholder="name@studentsahayak.online"
          />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            required
            placeholder="••••••••"
          />
        </div>
        <button type="submit" class="btn" id="loginBtn">Secure Login</button>
      </form>

      <div class="footer">Powered by AppScribe Innovations</div>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const errorDiv = document.getElementById("errorMessage");
          const btn = document.getElementById("loginBtn");

          btn.textContent = "Authenticating...";
          btn.disabled = true;
          errorDiv.style.display = "none";

          try {
            const response = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
              credentials: "include", // Crucial for saving the session cookie
            });

            const data = await response.json();

            if (response.ok) {
              // Store non-sensitive user info for the dashboard UI
              localStorage.setItem("cms_user", JSON.stringify(data.user));
              window.location.href = "/admin/dashboard.html";
            } else {
              errorDiv.textContent = data.error || "Authentication failed.";
              errorDiv.style.display = "block";
              btn.textContent = "Secure Login";
              btn.disabled = false;
            }
          } catch (error) {
            errorDiv.textContent = "Network error. Please try again.";
            errorDiv.style.display = "block";
            btn.textContent = "Secure Login";
            btn.disabled = false;
          }
        });
    </script>
  </body>
</html>
