<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile | Student Sahayak CMS</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      :root {
        --primary: #045c4b;
        --bg: #f4f7f5;
        --text: #333;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        display: flex;
        height: 100vh;
        background-color: var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      /* Unified Sidebar */
      .sidebar {
        width: 260px;
        background: white;
        border-right: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      .brand {
        padding: 1.5rem;
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--primary);
        border-bottom: 1px solid #e0e0e0;
      }
      .nav-menu {
        padding: 1rem 0;
        flex: 1;
        overflow-y: auto;
      }
      .nav-item {
        display: flex;
        align-items: center;
        padding: 0.75rem 1.5rem;
        color: #555;
        text-decoration: none;
        font-weight: 600;
        transition: 0.2s;
      }
      .nav-item i {
        width: 24px;
        font-size: 1.1rem;
        margin-right: 8px;
      }
      .nav-item:hover,
      .nav-item.active {
        background: #e6f7f3;
        color: var(--primary);
        border-right: 4px solid var(--primary);
      }
      .logout-btn {
        padding: 1rem 1.5rem;
        border-top: 1px solid #e0e0e0;
        cursor: pointer;
        color: #d32f2f;
        font-weight: 600;
        margin-top: auto;
        display: flex;
        align-items: center;
      }
      .logout-btn i {
        width: 24px;
        font-size: 1.1rem;
        margin-right: 8px;
      }
      .logout-btn:hover {
        background: #fdf0f0;
      }

      /* Unified Main Content */
      .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .topbar {
        background: white;
        padding: 1.25rem 2rem;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }
      .main-content {
        flex: 1;
        overflow-y: auto;
        padding: 2rem;
        display: flex;
        gap: 2rem;
        align-items: flex-start;
      }

      /* Page Specific */
      .card {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        flex: 1;
      }
      .profile-header {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        margin-bottom: 2rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid #eee;
      }
      .avatar {
        width: 80px;
        height: 80px;
        background: var(--primary);
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        font-weight: bold;
      }
      .badge {
        background: #e8f5e9;
        color: #2e7d32;
        padding: 0.3rem 0.8rem;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: bold;
        display: inline-block;
        margin-top: 0.5rem;
      }
      .info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        margin-bottom: 1rem;
      }
      .info-item label {
        display: block;
        font-size: 0.85rem;
        color: #666;
        font-weight: 600;
        margin-bottom: 0.3rem;
      }
      .info-item div {
        font-size: 1.05rem;
        color: #333;
        font-weight: 500;
      }
      .form-group {
        margin-bottom: 1.5rem;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: #333;
      }
      .form-group input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1rem;
      }
      .btn-submit {
        background: var(--primary);
        color: white;
        border: none;
        padding: 0.8rem 1.5rem;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Standardized Sidebar -->
    <aside class="sidebar">
      <div class="brand"><i class="fa-solid fa-pen-nib"></i> CMS Admin</div>
      <div class="nav-menu">
        <div id="managerNav">
          <a href="manage-users.html" class="nav-item"
            ><i class="fa-solid fa-users-gear"></i> Manage Users</a
          >
        </div>
        <a href="dashboard.html" class="nav-item"
          ><i class="fa-solid fa-chart-line"></i> Dashboard</a
        >
        <div id="articlesNav">
          <a href="create-article.html" class="nav-item"
            ><i class="fa-solid fa-file-circle-plus"></i> Create Article</a
          >
          <a href="all-articles.html" class="nav-item"
            ><i class="fa-solid fa-list"></i> All Articles</a
          >
        </div>
        <div id="chaptersNav">
          <a href="create-chapter.html" class="nav-item"
            ><i class="fa-solid fa-book-open"></i> Create Chapter</a
          >
          <a href="all-chapters.html" class="nav-item"
            ><i class="fa-solid fa-layer-group"></i> All Chapters</a
          >
        </div>
        <a href="media-library.html" class="nav-item"
          ><i class="fa-solid fa-images"></i> Media Library</a
        >
        <div
          style="
            margin-top: 1rem;
            border-top: 1px solid #eee;
            padding-top: 1rem;
          "
        >
          <a href="profile.html" class="nav-item active"
            ><i class="fa-solid fa-user"></i> My Profile</a
          >
        </div>
      </div>
      <div class="logout-btn" id="logoutBtn">
        <i class="fa-solid fa-right-from-bracket"></i> Sign out
      </div>
    </aside>

    <div class="main-wrapper">
      <!-- Standardized Topbar -->
      <header class="topbar">
        <h2>My Profile</h2>
        <div style="font-weight: 600">
          Welcome back, <span id="userName">Admin</span>
        </div>
      </header>

      <main class="main-content">
        <div class="card">
          <h2 style="color: var(--primary); margin-bottom: 1.5rem">
            Employee Information
          </h2>
          <div class="profile-header">
            <div class="avatar" id="avatarInitial">A</div>
            <div>
              <h3
                id="fullName"
                style="font-size: 1.5rem; margin: 0; color: #333"
              >
                Loading...
              </h3>
              <span class="badge" id="roleBadge">Role</span>
            </div>
          </div>
          <div class="info-grid">
            <div class="info-item">
              <label>Email Address</label>
              <div id="emailInfo">...</div>
            </div>
            <div class="info-item">
              <label>Department</label>
              <div id="deptInfo">...</div>
            </div>
            <div class="info-item">
              <label>Account Created</label>
              <div id="joinedInfo">...</div>
            </div>
          </div>
        </div>

        <div class="card">
          <h2 style="color: var(--primary); margin-bottom: 1.5rem">
            Security Settings
          </h2>
          <p style="font-size: 0.9rem; color: #666; margin-bottom: 1.5rem">
            Update your password here.
          </p>
          <form id="passwordForm">
            <div class="form-group">
              <label>Current Password</label
              ><input type="password" id="currentPassword" required />
            </div>
            <div class="form-group">
              <label>New Password</label
              ><input type="password" id="newPassword" required minlength="8" />
            </div>
            <div class="form-group">
              <label>Confirm New Password</label
              ><input
                type="password"
                id="confirmPassword"
                required
                minlength="8"
              />
            </div>
            <button type="submit" class="btn-submit" id="updateBtn">
              Update Password
            </button>
            <div
              id="statusMsg"
              style="margin-top: 1rem; font-weight: 600; text-align: center"
            ></div>
          </form>
        </div>
      </main>
    </div>

    <!-- Standardized JS Block -->
    <script>
      const user = JSON.parse(localStorage.getItem("cms_user"));
      if (!user) window.location.href = "/admin/index.html";
      document.getElementById("userName").textContent = user.first_name;

      const articleRoles = [
        "CEO",
        "Manager",
        "Content Manager & Editor",
        "Proofreader",
        "Article Writer",
      ];
      const chapterRoles = [
        "CEO",
        "Manager",
        "Content Manager & Editor",
        "Educational Content Writer",
      ];
      if (
        document.getElementById("articlesNav") &&
        !articleRoles.includes(user.role_name)
      )
        document.getElementById("articlesNav").style.display = "none";
      if (
        document.getElementById("chaptersNav") &&
        !chapterRoles.includes(user.role_name)
      )
        document.getElementById("chaptersNav").style.display = "none";
      if (
        document.getElementById("managerNav") &&
        !["CEO", "Manager"].includes(user.role_name)
      )
        document.getElementById("managerNav").style.display = "none";

      document
        .getElementById("logoutBtn")
        .addEventListener("click", async () => {
          await fetch("/api/auth/logout", {
            method: "POST",
            credentials: "include",
          });
          localStorage.removeItem("cms_user");
          window.location.href = "/admin/index.html";
        });

      /* Page Specific JS */
      async function loadProfile() {
        try {
          const response = await fetch("/api/users/profile", {
            credentials: "include",
          });
          if (response.ok) {
            const profileData = await response.json();
            document.getElementById("fullName").textContent =
              `${profileData.first_name} ${profileData.last_name}`;
            document.getElementById("avatarInitial").textContent =
              profileData.first_name.charAt(0).toUpperCase();
            document.getElementById("roleBadge").textContent =
              profileData.role_name || "Staff";
            document.getElementById("emailInfo").textContent =
              profileData.email;
            document.getElementById("deptInfo").textContent =
              profileData.department_name || "General";
            document.getElementById("joinedInfo").textContent = new Date(
              profileData.created_at,
            ).toLocaleDateString();
          }
        } catch (err) {
          console.error("Failed to load profile", err);
        }
      }

      document
        .getElementById("passwordForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const currentPass = document.getElementById("currentPassword").value;
          const newPass = document.getElementById("newPassword").value;
          const confirmPass = document.getElementById("confirmPassword").value;
          const statusMsg = document.getElementById("statusMsg");

          if (newPass !== confirmPass) {
            statusMsg.style.color = "red";
            statusMsg.textContent = "New passwords do not match.";
            return;
          }

          const btn = document.getElementById("updateBtn");
          btn.disabled = true;
          btn.textContent = "Updating...";

          try {
            const response = await fetch("/api/users/password", {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                currentPassword: currentPass,
                newPassword: newPass,
              }),
              credentials: "include",
            });
            const data = await response.json();
            if (response.ok) {
              statusMsg.style.color = "green";
              statusMsg.textContent = "Password updated successfully.";
              document.getElementById("passwordForm").reset();
            } else {
              statusMsg.style.color = "red";
              statusMsg.textContent = data.error || "Update failed.";
            }
          } catch (err) {
            statusMsg.style.color = "red";
            statusMsg.textContent = "Network error.";
          }
          btn.disabled = false;
          btn.textContent = "Update Password";
        });

      loadProfile();
    </script>
  </body>
</html>
