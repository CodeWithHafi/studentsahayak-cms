<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Chapter | Student Sahayak CMS</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://cdn.quilljs.com/1.3.7/quill.snow.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #045c4b;
        --bg: #f4f7f5;
        --text: #333;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        display: flex;
        height: 100vh;
        background-color: var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      .sidebar {
        width: 260px;
        background: white;
        border-right: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      .brand {
        padding: 1.5rem;
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--primary);
        border-bottom: 1px solid #e0e0e0;
      }
      .nav-menu {
        padding: 1rem 0;
        flex: 1;
        overflow-y: auto;
      }
      .nav-item {
        display: flex;
        align-items: center;
        padding: 0.75rem 1.5rem;
        color: #555;
        text-decoration: none;
        font-weight: 600;
        transition: 0.2s;
      }
      .nav-item i {
        width: 24px;
        font-size: 1.1rem;
        margin-right: 8px;
      }
      .nav-item:hover,
      .nav-item.active {
        background: #e6f7f3;
        color: var(--primary);
        border-right: 4px solid var(--primary);
      }
      .logout-btn {
        padding: 1rem 1.5rem;
        border-top: 1px solid #e0e0e0;
        cursor: pointer;
        color: #d32f2f;
        font-weight: 600;
        margin-top: auto;
        display: flex;
        align-items: center;
      }
      .logout-btn i {
        width: 24px;
        font-size: 1.1rem;
        margin-right: 8px;
      }
      .logout-btn:hover {
        background: #fdf0f0;
      }

      .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .topbar {
        background: white;
        padding: 1.25rem 2rem;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }
      .main-content {
        flex: 1;
        overflow-y: auto;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      .form-card {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }
      .form-group {
        margin-bottom: 1.5rem;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: #333;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1rem;
      }
      #editor {
        height: 400px;
        background: white;
      }
      .btn-submit {
        background: var(--primary);
        color: white;
        border: none;
        padding: 1rem 2rem;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand"><i class="fa-solid fa-pen-nib"></i> CMS Admin</div>
      <div class="nav-menu">
        <div id="managerNav">
          <a href="manage-users.html" class="nav-item"
            ><i class="fa-solid fa-users-gear"></i> Manage Users</a
          >
        </div>
        <a href="dashboard.html" class="nav-item"
          ><i class="fa-solid fa-chart-line"></i> Dashboard</a
        >
        <div id="articlesNav">
          <a href="create-article.html" class="nav-item"
            ><i class="fa-solid fa-file-circle-plus"></i> Create Article</a
          >
          <a href="all-articles.html" class="nav-item"
            ><i class="fa-solid fa-list"></i> All Articles</a
          >
        </div>
        <div id="chaptersNav">
          <a href="create-chapter.html" class="nav-item active"
            ><i class="fa-solid fa-book-open"></i> Create Chapter</a
          >
          <a href="all-chapters.html" class="nav-item"
            ><i class="fa-solid fa-layer-group"></i> All Chapters</a
          >
        </div>
        <a href="media-library.html" class="nav-item"
          ><i class="fa-solid fa-images"></i> Media Library</a
        >
        <div
          style="
            margin-top: 1rem;
            border-top: 1px solid #eee;
            padding-top: 1rem;
          "
        >
          <a href="profile.html" class="nav-item"
            ><i class="fa-solid fa-user"></i> My Profile</a
          >
        </div>
      </div>
      <div class="logout-btn" id="logoutBtn">
        <i class="fa-solid fa-right-from-bracket"></i> Sign out
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <h2>Content Editor</h2>
        <div style="font-weight: 600">
          Welcome back, <span id="userName">Admin</span>
        </div>
      </header>

      <main class="main-content">
        <div class="form-card">
          <h2 style="margin-bottom: 1.5rem; color: var(--primary)">
            Create Educational Chapter
          </h2>
          <form id="chapterForm">
            <div
              style="
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 1rem;
              "
            >
              <div class="form-group">
                <label>Education Board</label
                ><select id="board_id" required>
                  <option value="1">SEBA</option>
                  <option value="2">CBSE</option>
                </select>
              </div>
              <div class="form-group">
                <label>Class</label
                ><select id="class_id" required>
                  <option value="1">Class 10</option>
                  <option value="2">Class 12</option>
                </select>
              </div>
              <div class="form-group">
                <label>Subject</label
                ><select id="subject_id" required>
                  <option value="1">English</option>
                  <option value="2">Physics</option>
                </select>
              </div>
              <div class="form-group">
                <label>Chapter Number</label
                ><input type="number" id="chapter_number" required min="1" />
              </div>
            </div>
            <div
              style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem"
            >
              <div class="form-group">
                <label>Chapter Title</label
                ><input
                  type="text"
                  id="title"
                  required
                  placeholder="e.g., A Letter to God"
                />
              </div>
              <div class="form-group">
                <label>URL Slug (No spaces)</label
                ><input
                  type="text"
                  id="slug"
                  required
                  placeholder="e.g., chapter-1-a-letter-to-god"
                />
              </div>
            </div>
            <div class="form-group">
              <label>Meta Description (SEO)</label
              ><input type="text" id="meta_description" maxlength="160" />
            </div>
            <div class="form-group">
              <label>Chapter Content (Summary, Q&A, Notes)</label>
              <div id="editor"></div>
            </div>
            <button type="submit" class="btn-submit" id="saveBtn">
              Save & Publish Chapter
            </button>
            <div
              id="statusMsg"
              style="margin-top: 1rem; font-weight: 600"
            ></div>
          </form>
        </div>
      </main>
    </div>

    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <script>
      const user = JSON.parse(localStorage.getItem("cms_user"));
      if (!user) window.location.href = "/admin/index.html";
      document.getElementById("userName").textContent = user.first_name;

      const articleRoles = [
        "CEO",
        "Manager",
        "Content Manager & Editor",
        "Proofreader",
        "Article Writer",
      ];
      const chapterRoles = [
        "CEO",
        "Manager",
        "Content Manager & Editor",
        "Educational Content Writer",
      ];
      if (
        document.getElementById("articlesNav") &&
        !articleRoles.includes(user.role_name)
      )
        document.getElementById("articlesNav").style.display = "none";
      if (
        document.getElementById("chaptersNav") &&
        !chapterRoles.includes(user.role_name)
      )
        document.getElementById("chaptersNav").style.display = "none";
      if (
        document.getElementById("managerNav") &&
        !["CEO", "Manager"].includes(user.role_name)
      )
        document.getElementById("managerNav").style.display = "none";

      document
        .getElementById("logoutBtn")
        .addEventListener("click", async () => {
          await fetch("/api/auth/logout", {
            method: "POST",
            credentials: "include",
          });
          localStorage.removeItem("cms_user");
          window.location.href = "/admin/index.html";
        });

      const quill = new Quill("#editor", {
        theme: "snow",
        modules: {
          toolbar: [
            [{ header: [2, 3, false] }],
            ["bold", "italic", "underline"],
            [{ list: "ordered" }, { list: "bullet" }],
            ["link", "blockquote", "code-block"],
          ],
        },
      });

      document
        .getElementById("chapterForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("saveBtn");
          const status = document.getElementById("statusMsg");
          btn.disabled = true;
          btn.textContent = "Saving...";

          const payload = {
            board_id: parseInt(document.getElementById("board_id").value),
            class_id: parseInt(document.getElementById("class_id").value),
            subject_id: parseInt(document.getElementById("subject_id").value),
            chapter_number: parseInt(
              document.getElementById("chapter_number").value,
            ),
            title: document.getElementById("title").value,
            slug: document.getElementById("slug").value,
            seo_title:
              document.getElementById("title").value +
              " | " +
              document.getElementById("class_id").options[
                document.getElementById("class_id").selectedIndex
              ].text,
            meta_description: document.getElementById("meta_description").value,
            content_json: JSON.stringify({ html: quill.root.innerHTML }),
          };

          try {
            const response = await fetch("/api/chapters", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
              credentials: "include",
            });
            const data = await response.json();
            if (response.ok) {
              status.style.color = "green";
              status.textContent =
                "Chapter published successfully! ID: " + data.chapterId;
              document.getElementById("chapterForm").reset();
              quill.setContents([]);
            } else {
              status.style.color = "red";
              status.textContent = data.error || "Failed to save.";
            }
          } catch (err) {
            status.style.color = "red";
            status.textContent = "Network error.";
          }
          btn.disabled = false;
          btn.textContent = "Save & Publish Chapter";
        });
    </script>
  </body>
</html>
