<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Student Sahayak CMS</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      :root {
        --primary: #045c4b;
        --bg: #f4f7f5;
        --text: #333;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        display: flex;
        height: 100vh;
        background-color: var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      /* Unified Sidebar */
      .sidebar {
        width: 260px;
        background: white;
        border-right: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      .brand {
        padding: 1.5rem;
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--primary);
        border-bottom: 1px solid #e0e0e0;
      }
      .nav-menu {
        padding: 1rem 0;
        flex: 1;
        overflow-y: auto;
      }
      .nav-item {
        display: flex;
        align-items: center;
        padding: 0.75rem 1.5rem;
        color: #555;
        text-decoration: none;
        font-weight: 600;
        transition: 0.2s;
      }
      .nav-item i {
        width: 24px;
        font-size: 1.1rem;
        margin-right: 8px;
      }
      .nav-item:hover,
      .nav-item.active {
        background: #e6f7f3;
        color: var(--primary);
        border-right: 4px solid var(--primary);
      }
      .logout-btn {
        padding: 1rem 1.5rem;
        border-top: 1px solid #e0e0e0;
        cursor: pointer;
        color: #d32f2f;
        font-weight: 600;
        margin-top: auto;
        display: flex;
        align-items: center;
      }
      .logout-btn i {
        width: 24px;
        font-size: 1.1rem;
        margin-right: 8px;
      }
      .logout-btn:hover {
        background: #fdf0f0;
      }

      /* Unified Main Content */
      .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .topbar {
        background: white;
        padding: 1.25rem 2rem;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }
      .main-content {
        flex: 1;
        overflow-y: auto;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      /* Page Specific */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1.5rem;
      }
      .card {
        background: white;
        padding: 1.5rem;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        border-left: 5px solid var(--primary);
      }
      .card h3 {
        font-size: 0.9rem;
        color: #666;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
      }
      .card .value {
        font-size: 2rem;
        font-weight: 700;
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand"><i class="fa-solid fa-pen-nib"></i> CMS Admin</div>
      <div class="nav-menu">
        <div id="managerNav">
          <a href="manage-users.html" class="nav-item"
            ><i class="fa-solid fa-users-gear"></i> Manage Users</a
          >
        </div>
        <a href="dashboard.html" class="nav-item active"
          ><i class="fa-solid fa-chart-line"></i> Dashboard</a
        >
        <div id="articlesNav">
          <a href="create-article.html" class="nav-item"
            ><i class="fa-solid fa-file-circle-plus"></i> Create Article</a
          >
          <a href="all-articles.html" class="nav-item"
            ><i class="fa-solid fa-list"></i> All Articles</a
          >
        </div>
        <div id="chaptersNav">
          <a href="create-chapter.html" class="nav-item"
            ><i class="fa-solid fa-book-open"></i> Create Chapter</a
          >
          <a href="all-chapters.html" class="nav-item"
            ><i class="fa-solid fa-layer-group"></i> All Chapters</a
          >
        </div>
        <a href="media-library.html" class="nav-item"
          ><i class="fa-solid fa-images"></i> Media Library</a
        >
        <div
          style="
            margin-top: 1rem;
            border-top: 1px solid #eee;
            padding-top: 1rem;
          "
        >
          <a href="profile.html" class="nav-item"
            ><i class="fa-solid fa-user"></i> My Profile</a
          >
        </div>
      </div>
      <div class="logout-btn" id="logoutBtn">
        <i class="fa-solid fa-right-from-bracket"></i> Sign out
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <h2>Dashboard Overview</h2>
        <div style="font-weight: 600">
          Welcome back, <span id="userName">Admin</span>
        </div>
      </header>

      <main class="main-content">
        <div class="grid">
          <div class="card">
            <h3>Total Published Articles</h3>
            <div class="value" id="publishedCount">0</div>
          </div>
          <div class="card">
            <h3>Drafts Pending Review</h3>
            <div class="value" id="draftCount">0</div>
          </div>
          <div class="card" id="employeeCard" style="display: none">
            <h3>Total Employees</h3>
            <div class="value" id="employeeCount">0</div>
          </div>
          <div class="card">
            <h3>Active Live Tests</h3>
            <div class="value">0</div>
          </div>
        </div>
      </main>
    </div>

    <script>
      const user = JSON.parse(localStorage.getItem("cms_user"));
      if (!user) window.location.href = "/admin/index.html";
      document.getElementById("userName").textContent = user.first_name;

      const articleRoles = [
        "CEO",
        "Manager",
        "Content Manager & Editor",
        "Proofreader",
        "Article Writer",
      ];
      const chapterRoles = [
        "CEO",
        "Manager",
        "Content Manager & Editor",
        "Educational Content Writer",
      ];
      if (
        document.getElementById("articlesNav") &&
        !articleRoles.includes(user.role_name)
      )
        document.getElementById("articlesNav").style.display = "none";
      if (
        document.getElementById("chaptersNav") &&
        !chapterRoles.includes(user.role_name)
      )
        document.getElementById("chaptersNav").style.display = "none";
      if (
        document.getElementById("managerNav") &&
        !["CEO", "Manager"].includes(user.role_name)
      )
        document.getElementById("managerNav").style.display = "none";

      document
        .getElementById("logoutBtn")
        .addEventListener("click", async () => {
          await fetch("/api/auth/logout", {
            method: "POST",
            credentials: "include",
          });
          localStorage.removeItem("cms_user");
          window.location.href = "/admin/index.html";
        });

      async function loadLiveStats() {
        try {
          const artRes = await fetch("/api/articles", {
            credentials: "include",
          });
          if (artRes.ok) {
            const articles = await artRes.json();
            document.getElementById("publishedCount").textContent =
              articles.filter((a) => a.status === "Published").length;
            document.getElementById("draftCount").textContent = articles.filter(
              (a) => a.status !== "Published",
            ).length;
          }
          if (["CEO", "Manager"].includes(user.role_name)) {
            document.getElementById("employeeCard").style.display = "block";
            const userRes = await fetch("/api/users", {
              credentials: "include",
            });
            if (userRes.ok) {
              const users = await userRes.json();
              document.getElementById("employeeCount").textContent =
                users.length;
            }
          }
        } catch (error) {
          console.error("Failed to load dashboard stats", error);
        }
      }
      loadLiveStats();
    </script>
  </body>
</html>
