<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users | Student Sahayak CMS</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      :root {
        --primary: #045c4b;
        --bg: #f4f7f5;
        --text: #333;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        display: flex;
        height: 100vh;
        background-color: var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      /* Unified Sidebar */
      .sidebar {
        width: 260px;
        background: white;
        border-right: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      .brand {
        padding: 1.5rem;
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--primary);
        border-bottom: 1px solid #e0e0e0;
      }
      .nav-menu {
        padding: 1rem 0;
        flex: 1;
        overflow-y: auto;
      }
      .nav-item {
        display: flex;
        align-items: center;
        padding: 0.75rem 1.5rem;
        color: #555;
        text-decoration: none;
        font-weight: 600;
        transition: 0.2s;
      }
      .nav-item i {
        width: 24px;
        font-size: 1.1rem;
        margin-right: 8px;
      }
      .nav-item:hover,
      .nav-item.active {
        background: #e6f7f3;
        color: var(--primary);
        border-right: 4px solid var(--primary);
      }
      .logout-btn {
        padding: 1rem 1.5rem;
        border-top: 1px solid #e0e0e0;
        cursor: pointer;
        color: #d32f2f;
        font-weight: 600;
        margin-top: auto;
        display: flex;
        align-items: center;
      }
      .logout-btn i {
        width: 24px;
        font-size: 1.1rem;
        margin-right: 8px;
      }
      .logout-btn:hover {
        background: #fdf0f0;
      }

      /* Unified Main Content */
      .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .topbar {
        background: white;
        padding: 1.25rem 2rem;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }
      .main-content {
        flex: 1;
        overflow-y: auto;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      /* Page Specific */
      .card {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }
      .form-group {
        margin-bottom: 1.5rem;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: #333;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1rem;
      }
      .btn-submit {
        background: var(--primary);
        color: white;
        border: none;
        padding: 0.8rem 1.5rem;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        margin-top: 1rem;
      }
      th {
        background: #f8f9fa;
        padding: 1rem 1.5rem;
        color: #555;
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        border-bottom: 1px solid #e0e0e0;
      }
      td {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #eee;
        color: #333;
        font-size: 0.95rem;
      }
      .badge {
        background: #e8f5e9;
        color: #2e7d32;
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <!-- Standardized Sidebar -->
    <aside class="sidebar">
      <div class="brand"><i class="fa-solid fa-pen-nib"></i> CMS Admin</div>
      <div class="nav-menu">
        <div id="managerNav">
          <a href="manage-users.html" class="nav-item active"
            ><i class="fa-solid fa-users-gear"></i> Manage Users</a
          >
        </div>
        <a href="dashboard.html" class="nav-item"
          ><i class="fa-solid fa-chart-line"></i> Dashboard</a
        >
        <div id="articlesNav">
          <a href="create-article.html" class="nav-item"
            ><i class="fa-solid fa-file-circle-plus"></i> Create Article</a
          >
          <a href="all-articles.html" class="nav-item"
            ><i class="fa-solid fa-list"></i> All Articles</a
          >
        </div>
        <div id="chaptersNav">
          <a href="create-chapter.html" class="nav-item"
            ><i class="fa-solid fa-book-open"></i> Create Chapter</a
          >
          <a href="all-chapters.html" class="nav-item"
            ><i class="fa-solid fa-layer-group"></i> All Chapters</a
          >
        </div>
        <a href="media-library.html" class="nav-item"
          ><i class="fa-solid fa-images"></i> Media Library</a
        >
        <div
          style="
            margin-top: 1rem;
            border-top: 1px solid #eee;
            padding-top: 1rem;
          "
        >
          <a href="profile.html" class="nav-item"
            ><i class="fa-solid fa-user"></i> My Profile</a
          >
        </div>
      </div>
      <div class="logout-btn" id="logoutBtn">
        <i class="fa-solid fa-right-from-bracket"></i> Sign out
      </div>
    </aside>

    <div class="main-wrapper">
      <!-- Standardized Topbar -->
      <header class="topbar">
        <h2>Manage Users</h2>
        <div style="font-weight: 600">
          Welcome back, <span id="userName">Admin</span>
        </div>
      </header>

      <main class="main-content">
        <div class="card">
          <h2 style="color: var(--primary); margin-bottom: 1.5rem">
            Provision New Employee Account
          </h2>
          <form id="addUserForm">
            <div
              style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem"
            >
              <div class="form-group">
                <label>First Name</label
                ><input type="text" id="firstName" required />
              </div>
              <div class="form-group">
                <label>Last Name</label
                ><input type="text" id="lastName" required />
              </div>
            </div>
            <div
              style="
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 1.5rem;
              "
            >
              <div class="form-group">
                <label>Email</label><input type="email" id="email" required />
              </div>
              <div class="form-group">
                <label>Temporary Password</label
                ><input
                  type="text"
                  id="tempPassword"
                  required
                  minlength="8"
                  placeholder="e.g. Start@1234"
                />
              </div>
              <div class="form-group">
                <label>Assign Role</label>
                <select id="roleName" required>
                  <option value="Article Writer">Article Writer</option>
                  <option value="Educational Content Writer">
                    Educational Content Writer
                  </option>
                  <option value="Proofreader">Proofreader</option>
                  <option value="Content Manager & Editor">
                    Content Manager & Editor
                  </option>
                  <option value="Manager">Manager</option>
                  <option value="CEO">CEO</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn-submit" id="addBtn">
              Create Account
            </button>
            <span
              id="statusMsg"
              style="margin-left: 1rem; font-weight: bold"
            ></span>
          </form>
        </div>

        <div class="card">
          <h2 style="color: var(--primary); margin-bottom: 1rem">
            Employee Roster
          </h2>
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Joined</th>
              </tr>
            </thead>
            <tbody id="userTableBody">
              <tr>
                <td colspan="4" style="text-align: center">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <!-- Standardized JS Block -->
    <script>
      const user = JSON.parse(localStorage.getItem("cms_user"));
      if (!user) window.location.href = "/admin/index.html";
      document.getElementById("userName").textContent = user.first_name;

      if (!["CEO", "Manager"].includes(user.role_name))
        window.location.href = "/admin/dashboard.html";

      const articleRoles = [
        "CEO",
        "Manager",
        "Content Manager & Editor",
        "Proofreader",
        "Article Writer",
      ];
      const chapterRoles = [
        "CEO",
        "Manager",
        "Content Manager & Editor",
        "Educational Content Writer",
      ];
      if (
        document.getElementById("articlesNav") &&
        !articleRoles.includes(user.role_name)
      )
        document.getElementById("articlesNav").style.display = "none";
      if (
        document.getElementById("chaptersNav") &&
        !chapterRoles.includes(user.role_name)
      )
        document.getElementById("chaptersNav").style.display = "none";

      document
        .getElementById("logoutBtn")
        .addEventListener("click", async () => {
          await fetch("/api/auth/logout", {
            method: "POST",
            credentials: "include",
          });
          localStorage.removeItem("cms_user");
          window.location.href = "/admin/index.html";
        });

      /* Page Specific JS */
      async function fetchUsers() {
        try {
          const res = await fetch("/api/users", { credentials: "include" });
          const users = await res.json();
          const tbody = document.getElementById("userTableBody");
          tbody.innerHTML = "";
          users.forEach((u) => {
            tbody.innerHTML += `<tr>
                <td><strong>${u.first_name} ${u.last_name}</strong></td>
                <td>${u.email}</td>
                <td><span class="badge">${u.role_name}</span></td>
                <td>${new Date(u.created_at).toLocaleDateString()}</td>
            </tr>`;
          });
        } catch (err) {
          document.getElementById("userTableBody").innerHTML =
            '<tr><td colspan="4" style="color:red; text-align:center;">Failed to load users</td></tr>';
        }
      }

      document
        .getElementById("addUserForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("addBtn");
          const msg = document.getElementById("statusMsg");
          btn.disabled = true;

          const payload = {
            first_name: document.getElementById("firstName").value,
            last_name: document.getElementById("lastName").value,
            email: document.getElementById("email").value,
            password: document.getElementById("tempPassword").value,
            role_name: document.getElementById("roleName").value,
          };

          try {
            const res = await fetch("/api/users", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
              credentials: "include",
            });
            const data = await res.json();
            if (res.ok) {
              msg.style.color = "green";
              msg.textContent = "User created successfully!";
              document.getElementById("addUserForm").reset();
              fetchUsers();
            } else {
              msg.style.color = "red";
              msg.textContent = data.error;
            }
          } catch (err) {
            msg.style.color = "red";
            msg.textContent = "Network error.";
          }
          btn.disabled = false;
        });

      fetchUsers();
    </script>
  </body>
</html>
