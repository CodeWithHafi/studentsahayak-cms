<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users | Student Sahayak CMS</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      :root {
        --primary: #045c4b;
        --bg: #f4f7f5;
        --text: #333;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        display: flex;
        height: 100vh;
        background-color: var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      .sidebar {
        width: 260px;
        background: white;
        border-right: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      .brand {
        padding: 1.5rem;
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--primary);
        border-bottom: 1px solid #e0e0e0;
      }
      .nav-menu {
        padding: 1rem 0;
        flex: 1;
        overflow-y: auto;
      }
      .nav-item {
        display: flex;
        align-items: center;
        padding: 0.75rem 1.5rem;
        color: #555;
        text-decoration: none;
        font-weight: 600;
        transition: 0.2s;
      }
      .nav-item i {
        width: 24px;
        font-size: 1.1rem;
        margin-right: 8px;
      }
      .nav-item:hover,
      .nav-item.active {
        background: #e6f7f3;
        color: var(--primary);
        border-right: 4px solid var(--primary);
      }
      .logout-btn {
        padding: 1rem 1.5rem;
        border-top: 1px solid #e0e0e0;
        cursor: pointer;
        color: #d32f2f;
        font-weight: 600;
        margin-top: auto;
        display: flex;
        align-items: center;
      }

      .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .topbar {
        background: white;
        padding: 1.25rem 2rem;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }
      .main-content {
        flex: 1;
        overflow-y: auto;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      .card {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }
      .form-group {
        margin-bottom: 1.5rem;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: #333;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1rem;
      }
      .btn-submit {
        background: var(--primary);
        color: white;
        border: none;
        padding: 0.8rem 1.5rem;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
      }

      /* Action Buttons */
      .btn-sm {
        padding: 0.4rem 0.8rem;
        font-size: 0.8rem;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        margin-right: 0.5rem;
      }
      .btn-outline {
        background: #e0f2f1;
        color: var(--primary);
      }
      .btn-danger {
        background: #ffebee;
        color: #c62828;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        margin-top: 1rem;
      }
      th {
        background: #f8f9fa;
        padding: 1rem 1.5rem;
        color: #555;
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        border-bottom: 1px solid #e0e0e0;
      }
      td {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #eee;
        color: #333;
        font-size: 0.95rem;
      }
      .badge {
        background: #e8f5e9;
        color: #2e7d32;
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: bold;
      }

      /* Edit Modal Styles */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      }
      .modal-content {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        width: 90%;
        max-width: 500px;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand"><i class="fa-solid fa-pen-nib"></i> CMS Admin</div>
      <div class="nav-menu">
        <div id="managerNav">
          <a href="manage-users.html" class="nav-item active"
            ><i class="fa-solid fa-users-gear"></i> Manage Users</a
          >
        </div>
        <a href="dashboard.html" class="nav-item"
          ><i class="fa-solid fa-chart-line"></i> Dashboard</a
        >
        <div id="articlesNav">
          <a href="create-article.html" class="nav-item"
            ><i class="fa-solid fa-file-circle-plus"></i> Create Article</a
          >
          <a href="all-articles.html" class="nav-item"
            ><i class="fa-solid fa-list"></i> All Articles</a
          >
        </div>
        <div id="chaptersNav">
          <a href="create-chapter.html" class="nav-item"
            ><i class="fa-solid fa-book-open"></i> Create Chapter</a
          >
          <a href="all-chapters.html" class="nav-item"
            ><i class="fa-solid fa-layer-group"></i> All Chapters</a
          >
        </div>
        <a href="media-library.html" class="nav-item"
          ><i class="fa-solid fa-images"></i> Media Library</a
        >
        <div
          style="
            margin-top: 1rem;
            border-top: 1px solid #eee;
            padding-top: 1rem;
          "
        >
          <a href="profile.html" class="nav-item"
            ><i class="fa-solid fa-user"></i> My Profile</a
          >
        </div>
      </div>
      <div class="logout-btn" id="logoutBtn">
        <i class="fa-solid fa-right-from-bracket"></i> Sign out
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <h2>Manage Users</h2>
        <div style="font-weight: 600">
          Welcome back, <span id="userName">Admin</span>
        </div>
      </header>

      <main class="main-content">
        <div class="card">
          <h2 style="color: var(--primary); margin-bottom: 1.5rem">
            Provision New Employee Account
          </h2>
          <form id="addUserForm">
            <div
              style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem"
            >
              <div class="form-group">
                <label>First Name</label>
                <input type="text" id="firstName" required />
              </div>
              <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="lastName" required />
              </div>
            </div>
            <div
              style="
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 1.5rem;
              "
            >
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required />
              </div>
              <div class="form-group">
                <label>Temporary Password</label>
                <input
                  type="text"
                  id="tempPassword"
                  required
                  minlength="8"
                  placeholder="e.g. Start@1234"
                />
              </div>
              <div class="form-group">
                <label>Assign Role</label>
                <select id="roleName" required>
                  <option value="Article Writer">Article Writer</option>
                  <option value="Educational Content Writer">
                    Educational Content Writer
                  </option>
                  <option value="Proofreader">Proofreader</option>
                  <option value="Content Manager & Editor">
                    Content Manager & Editor
                  </option>
                  <option value="Manager">Manager</option>
                  <option value="CEO">CEO</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn-submit" id="addBtn">
              Create Account
            </button>
            <span
              id="statusMsg"
              style="margin-left: 1rem; font-weight: bold"
            ></span>
          </form>
        </div>

        <div class="card">
          <h2 style="color: var(--primary); margin-bottom: 1rem">
            Employee Roster
          </h2>
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Joined</th>
                <th>Actions</th>
                <!-- NEW COLUMN -->
              </tr>
            </thead>
            <tbody id="userTableBody">
              <tr>
                <td colspan="5" style="text-align: center">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <!-- Edit User Modal -->
    <div id="editModal" class="modal">
      <div class="modal-content">
        <h3 style="color: var(--primary); margin-bottom: 1rem">
          Edit Employee Profile
        </h3>
        <form id="editUserForm">
          <input type="hidden" id="editUserId" />
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem">
            <div class="form-group">
              <label>First Name</label>
              <input type="text" id="editFirstName" required />
            </div>
            <div class="form-group">
              <label>Last Name</label>
              <input type="text" id="editLastName" required />
            </div>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="editEmail" required />
          </div>
          <div class="form-group">
            <label>Role</label>
            <select id="editRoleName" required>
              <option value="Article Writer">Article Writer</option>
              <option value="Educational Content Writer">
                Educational Content Writer
              </option>
              <option value="Proofreader">Proofreader</option>
              <option value="Content Manager & Editor">
                Content Manager & Editor
              </option>
              <option value="Manager">Manager</option>
              <option value="CEO">CEO</option>
            </select>
          </div>
          <div class="modal-actions">
            <button
              type="button"
              class="btn-sm btn-outline"
              onclick="closeEditModal()"
              style="padding: 0.6rem 1.2rem"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="btn-submit"
              id="saveEditBtn"
              style="width: auto"
            >
              Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const user = JSON.parse(localStorage.getItem("cms_user"));
      if (!user) window.location.href = "/admin/index.html";
      document.getElementById("userName").textContent = user.first_name;

      // Restrict page to Manager & CEO
      if (!["CEO", "Manager"].includes(user.role_name))
        window.location.href = "/admin/dashboard.html";

      const articleRoles = [
        "CEO",
        "Manager",
        "Content Manager & Editor",
        "Proofreader",
        "Article Writer",
      ];
      const chapterRoles = [
        "CEO",
        "Manager",
        "Content Manager & Editor",
        "Educational Content Writer",
      ];
      if (
        document.getElementById("articlesNav") &&
        !articleRoles.includes(user.role_name)
      )
        document.getElementById("articlesNav").style.display = "none";
      if (
        document.getElementById("chaptersNav") &&
        !chapterRoles.includes(user.role_name)
      )
        document.getElementById("chaptersNav").style.display = "none";

      document
        .getElementById("logoutBtn")
        .addEventListener("click", async () => {
          await fetch("/api/auth/logout", {
            method: "POST",
            credentials: "include",
          });
          localStorage.removeItem("cms_user");
          window.location.href = "/admin/index.html";
        });

      let allUsers = []; // Global state to hold user data for editing

      /* Fetch & Render Users */
      async function fetchUsers() {
        try {
          const res = await fetch("/api/users", { credentials: "include" });
          allUsers = await res.json();
          const tbody = document.getElementById("userTableBody");
          tbody.innerHTML = "";

          allUsers.forEach((u) => {
            // Role-based UI rendering
            const isCEO = user.role_name === "CEO";
            const deleteHtml = isCEO
              ? `<button class="btn-sm btn-danger" onclick="deleteUser(${u.id})">Delete</button>`
              : "";
            const editHtml = `<button class="btn-sm btn-outline" onclick="openEditModal(${u.id})">Edit</button>`;

            tbody.innerHTML += `<tr>
                <td><strong>${u.first_name} ${u.last_name}</strong></td>
                <td>${u.email}</td>
                <td><span class="badge">${u.role_name}</span></td>
                <td>${new Date(u.created_at).toLocaleDateString()}</td>
                <td>
                  ${editHtml}
                  ${deleteHtml}
                </td>
            </tr>`;
          });
        } catch (err) {
          document.getElementById("userTableBody").innerHTML =
            '<tr><td colspan="5" style="color:red; text-align:center;">Failed to load users</td></tr>';
        }
      }

      /* Create User */
      document
        .getElementById("addUserForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("addBtn");
          const msg = document.getElementById("statusMsg");
          btn.disabled = true;

          const payload = {
            first_name: document.getElementById("firstName").value,
            last_name: document.getElementById("lastName").value,
            email: document.getElementById("email").value,
            password: document.getElementById("tempPassword").value,
            role_name: document.getElementById("roleName").value,
          };

          try {
            const res = await fetch("/api/users", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
              credentials: "include",
            });
            const data = await res.json();
            if (res.ok) {
              msg.style.color = "green";
              msg.textContent = "User created successfully!";
              document.getElementById("addUserForm").reset();
              fetchUsers();
            } else {
              msg.style.color = "red";
              msg.textContent = data.error;
            }
          } catch (err) {
            msg.style.color = "red";
            msg.textContent = "Network error.";
          }
          btn.disabled = false;
        });

      /* Edit User Functions */
      function openEditModal(userId) {
        const targetUser = allUsers.find((u) => u.id === userId);
        if (!targetUser) return;

        document.getElementById("editUserId").value = targetUser.id;
        document.getElementById("editFirstName").value = targetUser.first_name;
        document.getElementById("editLastName").value = targetUser.last_name;
        document.getElementById("editEmail").value = targetUser.email;
        document.getElementById("editRoleName").value = targetUser.role_name;

        document.getElementById("editModal").style.display = "flex";
      }

      function closeEditModal() {
        document.getElementById("editModal").style.display = "none";
      }

      document
        .getElementById("editUserForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const userId = document.getElementById("editUserId").value;
          const btn = document.getElementById("saveEditBtn");
          btn.disabled = true;
          btn.textContent = "Saving...";

          const payload = {
            first_name: document.getElementById("editFirstName").value,
            last_name: document.getElementById("editLastName").value,
            email: document.getElementById("editEmail").value,
            role_name: document.getElementById("editRoleName").value,
          };

          try {
            const res = await fetch(`/api/users/${userId}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
              credentials: "include",
            });
            const data = await res.json();

            if (res.ok) {
              closeEditModal();
              fetchUsers();
            } else {
              alert(data.error || "Failed to update user.");
            }
          } catch (err) {
            alert("Network error.");
          }
          btn.disabled = false;
          btn.textContent = "Save Changes";
        });

      /* Delete User */
      async function deleteUser(userId) {
        if (
          !confirm(
            "Are you sure you want to permanently delete this user account?",
          )
        )
          return;

        try {
          const res = await fetch(`/api/users/${userId}`, {
            method: "DELETE",
            credentials: "include",
          });
          const data = await res.json();

          if (res.ok) {
            fetchUsers();
          } else {
            alert(data.error || "Failed to delete user.");
          }
        } catch (err) {
          alert("Network error.");
        }
      }

      // Initialize
      fetchUsers();
    </script>
  </body>
</html>
